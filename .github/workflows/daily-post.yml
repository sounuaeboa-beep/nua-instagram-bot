name: Daily Instagram Post

on:
  schedule:
    - cron: "0 13 * * *"   # 10:00 BRT
  workflow_dispatch:        # manual trigger

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python scripts/run_daily.py

      - name: Commit history & rotation
        run: |
          git config user.name "nu.a bot"
          git config user.email "bot@nu.a"
          git add data/history.json data/product_rotation.json
          git diff --staged --quiet || git commit -m "chore: update post history $(date -u +%Y-%m-%d)"
          git push
