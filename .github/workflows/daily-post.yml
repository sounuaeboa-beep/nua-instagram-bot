name: Daily Instagram Post

on:
  schedule:
    - cron: "45 12 * * *"  # 09:45 BRT
    - cron: "45 20 * * *"  # 17:45 BRT
  workflow_dispatch:        # manual run; dry run builds everything but publishes nothing
    inputs:
      dry_run:
        description: "Dry run (no publish)"
        type: boolean
        default: true

concurrency:
  group: daily-post

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          REPO_ADMIN_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: python scripts/run_daily.py ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Keep the dry-run image for review
        if: always() && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-image
          path: output/*.png
          if-no-files-found: ignore

      - name: Commit post history
        if: always() && !inputs.dry_run
        run: |
          git config user.name "nu.a bot"
          git config user.email "bot@nu.a"
          git add data/history.json data/token_state.json
          git diff --staged --quiet || git commit -m "chore: log post $(date -u +%Y-%m-%d)"
          git push
